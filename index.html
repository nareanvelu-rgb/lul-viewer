<title>LUL Log Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">

<style>
/* Layout: centered drop zone → full-screen log view */
:root {
  --bg: #0a0a0c;
  --surface: #111114;
  --border: #1c1c22;
  --border-hi: #2a2a32;
  --fg: #e2e2e8;
  --muted: #5a5a68;
  --accent: #00c896;
  --accent-dim: rgba(0,200,150,.12);
  --accent-glow: rgba(0,200,150,.2);
  --bad: #ff5566;
  --bad-dim: rgba(255,85,102,.12);
  --warn: #f5a623;
  --code-bg: #0d0d10;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --sans: 'Inter', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 36px;
  max-width: 900px;
  margin-inline: auto;
}
.logo {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo svg { width: 18px; height: 18px; fill: var(--accent); }
.header-text h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--fg); }
.header-text p  { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* ── Drop zone ── */
#drop-view {
  max-width: 540px;
  margin: 80px auto 0;
  text-align: center;
}
.drop-zone {
  border: 1.5px dashed var(--border-hi);
  border-radius: 16px;
  padding: 56px 32px;
  cursor: pointer;
  transition: border-color .2s, background .2s, box-shadow .2s;
  position: relative;
}
.drop-zone.drag-over {
  border-color: var(--accent);
  background: var(--accent-dim);
  box-shadow: 0 0 0 4px var(--accent-glow);
}
.drop-icon {
  width: 56px; height: 56px;
  margin: 0 auto 20px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border-hi);
  display: flex; align-items: center; justify-content: center;
}
.drop-icon svg { width: 26px; height: 26px; }
.drop-title { font-size: 16px; font-weight: 600; color: var(--fg); margin-bottom: 8px; }
.drop-sub   { font-size: 13px; color: var(--muted); line-height: 1.6; }
.drop-sub span { color: var(--accent); font-weight: 500; }
.file-input { display: none; }
.or-sep { font-size: 12px; color: var(--muted); margin: 24px 0 0; }

/* ── Log view ── */
#log-view { display: none; max-width: 900px; margin-inline: auto; }

.log-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.log-meta { font-size: 13px; color: var(--muted); }
.log-meta strong { color: var(--accent); font-weight: 500; font-family: var(--mono); font-size: 12px; }
.toolbar-actions { display: flex; gap: 8px; }

.btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 7px;
  border: 1px solid var(--border-hi);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: border-color .15s, background .15s, color .15s;
}
.btn:hover { border-color: var(--border-hi); background: #1a1a1f; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.btn.accent:hover { background: #00e0a8; border-color: #00e0a8; }
.btn svg { width: 13px; height: 13px; flex-shrink: 0; }

.log-frame {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.log-frame-bar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
}
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-hi); }
.log-content {
  padding: 20px 24px;
  overflow-x: auto;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
}
#log-text {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--fg);
  white-space: pre;
  min-width: 0;
}

/* Section headers inside the log */
#log-text .section  { color: var(--warn);   font-weight: 500; }
#log-text .divider  { color: var(--border-hi); }
#log-text .label    { color: var(--muted); }
#log-text .value    { color: var(--fg); }
#log-text .key-line { color: #9d84ff; }
#log-text .ip-line  { color: var(--accent); }

/* ── Error banner ── */
#error-banner {
  display: none;
  max-width: 540px;
  margin: 20px auto 0;
  background: var(--bad-dim);
  border: 1px solid var(--bad);
  border-radius: 10px;
  padding: 14px 18px;
  font-size: 13px;
  color: var(--bad);
  display: none;
  align-items: flex-start;
  gap: 10px;
}
#error-banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
#error-banner.visible { display: flex; }

/* ── Copy toast ── */
#toast {
  position: fixed;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 12px;
  font-weight: 500;
  padding: 8px 18px;
  border-radius: 999px;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>

<!-- Header -->
<header class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>LUL Log Viewer</h1>
    <p>Internal support tool &mdash; LevelUpLabs</p>
  </div>
</header>

<!-- Drop view -->
<div id="drop-view">
  <div class="drop-zone" id="drop-zone">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="11" x2="12" y2="17"/>
        <polyline points="9 14 12 17 15 14"/>
      </svg>
    </div>
    <div class="drop-title">Drop a .lul support log here</div>
    <div class="drop-sub">
      Or <span>click to browse</span> for the file<br>
      Generated by the LevelUpLabs launcher
    </div>
    <input type="file" class="file-input" id="file-input" accept=".lul">
  </div>
  <div class="or-sep">AES-256 decryption runs entirely in this page</div>

  <div id="error-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="error-msg"></span>
  </div>
</div>

<!-- Log view -->
<div id="log-view">
  <div class="log-toolbar">
    <div class="log-meta">Decrypted: <strong id="log-filename"></strong></div>
    <div class="toolbar-actions">
      <button class="btn accent" id="btn-copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy log
      </button>
      <button class="btn" id="btn-new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Load another
      </button>
    </div>
  </div>

  <div class="log-frame">
    <div class="log-frame-bar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="log-content">
      <div id="log-text"></div>
    </div>
  </div>
</div>

<div id="toast">Copied to clipboard</div>

<script>
const MAGIC = [76,85,76,76,79,71,1,0]; // LULLOG\x01\x00
const PASSWORD = '59f9fm3ml20zz90fjgnt6985632f2';

const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const dropView   = document.getElementById('drop-view');
const logView    = document.getElementById('log-view');
const logText    = document.getElementById('log-text');
const logFilename= document.getElementById('log-filename');
const errBanner  = document.getElementById('error-banner');
const errMsg     = document.getElementById('error-msg');
const btnCopy    = document.getElementById('btn-copy');
const btnNew     = document.getElementById('btn-new');
const toast      = document.getElementById('toast');

let rawDecrypted = '';

// Drop zone
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

btnNew.addEventListener('click', () => {
  logView.style.display = 'none';
  dropView.style.display = 'block';
  fileInput.value = '';
  hideError();
});

btnCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(rawDecrypted).then(() => showToast()).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = rawDecrypted;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast(); } catch {}
    document.body.removeChild(ta);
  });
});

function showToast() {
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function showError(msg) {
  errMsg.textContent = msg;
  errBanner.classList.add('visible');
}
function hideError() { errBanner.classList.remove('visible'); }

async function handleFile(file) {
  hideError();
  if (!file.name.toLowerCase().endsWith('.lul') && !file.name.toLowerCase().endsWith('.log')) {
    // still try — just warn
  }
  const buf = await file.arrayBuffer();
  try {
    const text = await decryptLul(buf);
    rawDecrypted = text;
    logFilename.textContent = file.name;
    renderLog(text);
    dropView.style.display = 'none';
    logView.style.display = 'block';
  } catch (err) {
    showError(err.message || 'Decryption failed. Make sure this is a valid .lul support log.');
  }
}

async function decryptLul(buf) {
  const data = new Uint8Array(buf);
  if (data.length < 9) throw new Error('File is too small to be a valid log.');
  for (let i = 0; i < 8; i++) {
    if (data[i] !== MAGIC[i]) throw new Error('Invalid file header — this doesn\'t look like a LUL support log.');
  }
  const encrypted = data.slice(8);
  const pwBytes = new TextEncoder().encode(PASSWORD);
  const keyBytes = await crypto.subtle.digest('SHA-256', pwBytes);
  const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
  const iv = new Uint8Array(16); // zero IV (CryptoAPI default)
  let decrypted;
  try {
    decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, encrypted);
  } catch {
    throw new Error('Decryption failed — the file may be corrupted or from a different version.');
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(decrypted).replace(/\x00+$/, '');
}

function renderLog(text) {
  const lines = text.split(/\r?\n/);
  const frag = document.createDocumentFragment();

  lines.forEach(line => {
    const span = document.createElement('span');
    // Colour-code the log lines
    if (/^={3,}/.test(line) || /^-{3,}/.test(line)) {
      span.className = 'divider';
    } else if (/^(SYSTEM|ANTIVIRUS|REDEEMED KEYS|NETWORK|SYSTEM INFORMATION|CORE ISOLATION|CLOCK & HOSTS|Level Up Labs)/.test(line.trim())) {
      span.className = 'section';
    } else if (/^\s{2}.*HWID:/.test(line) || /\bHWID\b/.test(line)) {
      span.className = 'key-line';
    } else if (/^\s{2}Public IP/.test(line) || /ip address/i.test(line)) {
      span.className = 'ip-line';
    } else if (/^\s{2}[A-Za-z]/.test(line) && line.includes('  ')) {
      // Label + value line — keep default
      span.className = 'value';
    }
    span.textContent = line + '\n';
    frag.appendChild(span);
  });

  logText.textContent = '';
  logText.appendChild(frag);
}
</script>
